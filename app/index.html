<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1A24" />
    <title>Anchored Steps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
      *{box-sizing:border-box}
      html,body,#root{height:100%;min-height:100vh}
      body{background:#0F1A24;margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
      button,input,select,textarea{font-family:inherit}
      button{cursor:pointer}
      button:active,a.hub-door:active{transform:scale(0.985)}
      @keyframes hubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .hub-in{animation:hubIn .32s ease both}
      @media (prefers-reduced-motion: reduce){.hub-in{animation:none}button:active,a.hub-door:active{transform:none}}
      :focus-visible{outline:2px solid #CFA968;outline-offset:3px;border-radius:6px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/hub.jsx"></script>
  </body>
</html>
